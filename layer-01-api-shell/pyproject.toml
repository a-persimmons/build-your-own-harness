[project]
name = "layer-01-api-shell"
version = "0.1.0"
description = "Layer 1: API shell with multi-provider support and streaming REPL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.97.0",
    "openai>=2.33.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_l01"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires real API keys (deselect with -m 'not integration')"]
