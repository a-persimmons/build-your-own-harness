[project]
name = "layer-03-context"
version = "0.1.0"
description = "Layer 3: token counting, sliding window, and summarization-based context management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.97.0",
    "openai>=2.33.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.9.0",
    "layer-01-api-shell",
    "layer-02-tools",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires real API keys (deselect with -m 'not integration')"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_l03"]

[tool.uv.sources]
layer-01-api-shell = { path = "../layer-01-api-shell" }
layer-02-tools = { path = "../layer-02-tools" }
