[project]
name = "layer-02-tools"
version = "0.1.0"
description = "Layer 2: typed tool registry, function calling, and the core agentic loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.97.0",
    "openai>=2.33.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "layer-01-api-shell",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires real API keys (deselect with -m 'not integration')"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_l02"]

[tool.uv.sources]
layer-01-api-shell = { path = "../layer-01-api-shell" }
